      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    UnauthorizedError:
      description: Standard authentication error envelope.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    ForbiddenError:
      description: Standard authorization error envelope.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    NotFoundError:
      description: Resource not found or inaccessible.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
    ConflictError:
      description: Revision, thread depth, or business conflict.
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } }
