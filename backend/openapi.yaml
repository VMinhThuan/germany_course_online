                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Standard error envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      x-contract:
        access: PUBLIC
        backendModule: catalog
        relatedCollections:
          - courses
          - course_sections
          - lessons
          - media_assets
        frontendOperation: PublicCourseRepository.listCourses()
        query: page,pageSize,level?,q?,sort?
        requestBody: none
        responseData: CoursePage
        idempotency: Safe read
        validation: Published and non-deleted hierarchy only; sort is limited to the documented allowlist
      security: []
