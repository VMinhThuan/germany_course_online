openapi: 3.1.0
info:
  title: PAniverseDeutsch LMS API
  version: 1.0.0
  description: BE-00 design contract. Provisional endpoints and schema extensions are labeled in the
    endpoint catalog and x-contract metadata. Manual bank transfer only; no payment gateway,
    payment_transactions, or webhook.
servers:
  - url: /api/v1
    description: Deployment origin is environment-specific.
tags:
  - name: Public
    description: Allowlisted public course/site/media reads.
  - name: Authentication
    description: Credential, reset, refresh-cookie and current-user endpoints.
  - name: Student
    description: Authenticated Student self-service.
  - name: Learning
    description: Enrolled Student lesson, exercise, progress, notes and asset access.
  - name: Lesson Comments
    description: Enrollment-gated lesson discussions with student-safe anonymity DTOs and Admin moderation.
  - name: Quiz
    description: Student attempts; answer correctness is withheld before authorized result.
  - name: Commerce
    description: Quotes, coupons, orders, manual transfer and renewals.
  - name: Admin Catalog
    description: Admin CMS, quiz and media operations.
  - name: Admin Management
    description: Admin user, enrollment, commerce, settings, approval and audit operations.
paths:
  /site-settings/public:
    get:
      operationId: getPublicSiteSettings
      summary: Read allowlisted public site settings
      tags:
        - Public
      description: "Access: PUBLIC. Public projection only. If settings have not been saved, default values are returned without creating a database record."
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: "#/components/schemas/PublicSiteSettings"
        "400":
          description: Standard error envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Standard error envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Standard error envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Standard error envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Standard error envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          description: Standard error envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Standard error envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Standard error envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      x-contract:
        access: PUBLIC
        backendModule: settings
        relatedCollections:
          - site_settings
          - media_assets
        frontendOperation: apiPublicRepository.getPublicSiteSettings
        query: none
        requestBody: none
        responseData: PublicSiteSettings
        idempotency: Safe read
        validation: Public projection only
      security: []
  /courses:
    get:
      operationId: listPublishedCourses
      summary: List published courses
      tags:
        - Public
      description: "Access: PUBLIC. Published and non-deleted hierarchy only"
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: level
          in: query
          required: false
          schema:
            type: string
            maxLength: 32
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - sortOrder
              - newest
              - title
              - price_asc
              - price_desc
            default: sortOrder
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    const: true
                  data:
                    $ref: "#/components/schemas/CoursePage"
        "400":
          description: Standard error envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Standard error envelope.
          content:
            application/json:
              schema:
